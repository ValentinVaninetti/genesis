# =============================================================
#  GENESIS — universe configuration
#  Every physical parameter lives here, outside the code.
#  An invalid file fails at startup (never at runtime).
# =============================================================

[universe]
name = "Genesis"
# Total size of the universe (extent per axis, periodic torus).
size = { x = 128.0, y = 128.0, z = 128.0 }
# Time delta per tick (seconds of simulation).
dt = 0.016666666666666666
# Atoms seeded at startup ("big bang" of the simulation).
initial_atoms = 100000
# Capacity of the metrics history.
stats_history = 1024

[rng]
seed = 42

[physics]
# Collision radius of each particle (diameter = 2·radius).
particle_radius = 0.4
# Initial temperature (defines the thermal velocity of the seeding).
initial_temperature = 300.0
# Speed limit (numeric safety).
speed_limit = 1000.0
# Effective thermal constant: T = (2/3)·⟨K⟩/thermal_constant.
thermal_constant = 0.01
# Reference gravitational constant (future law).
gravity_constant = 6.674e-11
# Thermostat target temperature (kelvin) and relaxation time (ticks).
thermostat_temperature = 300.0
thermostat_tau = 20.0

[systems]
enable_movement = true
enable_boundaries = true
# The LJ forces (Lennard-Jones) are the main interaction: the short-range
# repulsion already prevents overlap, so impulse collisions are disabled by
# default.
enable_collisions = false
enable_forces = true
# Berendsen thermostat (velocity rescaling) for NVT runs. An instrument, not a
# law: off by default (NVE conserves energy).
enable_thermostat = false
# Electrostatics law (Coulomb) between per-species charges (O −1, Na +1, Si
# +0.5, metals +1). Charge is a law constant, not a programmed bond.
enable_electrostatics = false
# Gravitational law between masses (truncated at physics.gravity_cutoff).
enable_gravity = false
# Persistent-bond observation: pairs whose bound episode survives
# stats.bond_min_periods vibrational periods get recorded in the `Bonds`
# component. Observation only — it does not affect the dynamics by itself.
enable_bond_observation = false
# Physical coupling of the *observed* bonds: a pair in `Bonds` feels a
# harmonic spring toward the LJ equilibrium distance (k = well curvature,
# switched off before the binding radius). Nothing is programmed per species:
# the bond only exists because the observation measured it.
enable_bond_interaction = false

[stats]
# Observation, not physics: velocity histogram.
histogram_bins = 32
histogram_max_speed = 10.0
# Every how many ticks the aggregates are measured (emergent structure).
structure_interval = 100
# Persistent-bond thresholds (bond observation): an episode shorter than
# `bond_min_periods` vibrational periods of the pair does not count; a pair is
# "bound" while r < bond_k_bind·σ_ij.
bond_min_periods = 10.0
bond_k_bind = 1.5
# Observability exports (disabled when empty): metrics CSV and position
# frames (XYZ) to plot outside the engine (matplotlib, gnuplot, OVITO).
csv_path = "data/stats.csv"
csv_interval = 10
xyz_prefix = "data/frames/frame"
xyz_interval = 200
