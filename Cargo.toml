[package]
name = "genesis"
version = "0.1.0"
edition = "2024"
description = "Motor de simulacion de universo: leyes simples y generales, complejidad emergente."
license = "MIT"

[lib]
name = "genesis"
path = "src/lib.rs"

[[bin]]
name = "genesis"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = { version = "0.8", features = ["serde1"] }
rand_xoshiro = { version = "0.6", features = ["serde1"] }
rayon = "1"
bincode = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
